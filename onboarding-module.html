<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get to Value with Harvey — Scaled Onboarding (sample) | Alex Donnelly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#191712; --muted:#6c6358; --faint:#8c8478; --line:#e7e1d6; --line-2:#d8d1c4;
    --bg:#f6f3ec; --paper:#fffefb; --tint:#efeadf; --accent:#191712;
    --green:#3a6b3f; --green-bg:#eaf1e9; --red:#9a3b34; --red-bg:#f6eae8;
    --serif:'Spectral',Georgia,'Times New Roman',serif;
    --sans:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
    -webkit-font-smoothing:antialiased}
  a{color:var(--ink)}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
    padding:15px 26px;background:rgba(246,243,236,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{display:flex;flex-direction:column;line-height:1.2}
  .brand strong{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em}
  .brand small{font-size:11px;color:var(--muted);letter-spacing:.01em}
  .progress-wrap{flex:1;display:flex;align-items:center;gap:12px;max-width:480px;margin-left:auto}
  .progress-track{flex:1;height:4px;border-radius:99px;background:var(--line-2);overflow:hidden}
  .progress-bar{height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .35s ease}
  .progress-pct{font-size:11px;font-weight:600;color:var(--muted);min-width:32px;text-align:right;letter-spacing:.02em}
  .shell{display:grid;grid-template-columns:280px 1fr;max-width:1140px;margin:0 auto;min-height:calc(100vh - 58px)}
  .sidebar{padding:30px 16px;border-right:1px solid var(--line)}
  .sidebar h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 16px 10px;font-weight:600}
  .toc{list-style:none;margin:0;padding:0}
  .toc li{margin:0 0 2px}
  .toc button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;
    padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit;color:var(--muted);transition:background .15s,color .15s}
  .toc button:hover{background:var(--tint);color:var(--ink)}
  .toc button.active{background:var(--tint);color:var(--ink)}
  .toc .num{flex:none;width:23px;height:23px;border-radius:50%;border:1px solid var(--line-2);
    display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--faint);background:var(--paper)}
  .toc button.active .num{border-color:var(--ink);color:var(--ink)}
  .toc .num.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .toc .t{font-size:13.5px;font-weight:500;padding-top:2px;line-height:1.35}
  .main{padding:48px clamp(20px,5vw,72px) 70px;max-width:760px}
  .pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);margin-bottom:18px}
  h1.lesson{font-family:var(--serif);font-weight:500;font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.1;
    margin:0 0 20px;letter-spacing:-.015em}
  .lesson p{font-size:1.05rem;margin:0 0 16px;color:#2a2620}
  .lesson ul{margin:0 0 16px;padding-left:20px}.lesson li{margin:0 0 9px;color:#2a2620}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:0 0 16px}
  .card h3{font-family:var(--serif);font-weight:600;margin:0 0 8px;font-size:1.15rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:4px 0 18px}
  .mini{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
  .mini .k{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
  .mini p{font-size:.92rem;margin:0;color:var(--muted);line-height:1.5}
  .callout{border-left:2px solid var(--ink);padding:6px 0 6px 20px;margin:6px 0 18px;color:#2a2620}
  .callout strong{font-weight:600}
  .quiz{border-top:1px solid var(--line);margin:26px 0 4px;padding:24px 0 4px}
  .quiz .qk{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 8px}
  .quiz .q{font-family:var(--serif);font-size:1.2rem;font-weight:500;margin:0 0 16px}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line-2);background:var(--paper);border-radius:11px;
    padding:13px 16px;margin:0 0 10px;cursor:pointer;font:inherit;font-size:.97rem;transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--ink)}
  .opt.correct{border-color:var(--green);background:var(--green-bg)}
  .opt.wrong{border-color:var(--red);background:var(--red-bg)}
  .opt[disabled]{cursor:default}
  .feedback{font-size:.94rem;margin:10px 2px 0;display:none;line-height:1.5}
  .feedback.show{display:block}
  .feedback.ok{color:var(--green)}.feedback.no{color:var(--red)}
  .navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:34px;
    border-top:1px solid var(--line);padding-top:22px}
  .btn{border:0;border-radius:99px;padding:12px 24px;font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;
    transition:opacity .15s,background .15s}
  .btn.primary{background:var(--ink);color:var(--paper)}.btn.primary:hover{opacity:.88}
  .btn.ghost{background:none;color:var(--muted);border:1px solid var(--line-2)}.btn.ghost:hover{color:var(--ink);border-color:var(--ink)}
  .btn:disabled{opacity:.35;cursor:default}
  .disc{font-size:11.5px;color:var(--faint);font-style:italic;margin-top:18px;line-height:1.5}
  .checklist{list-style:none;padding:0;margin:0 0 16px}
  .checklist li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);color:#2a2620}
  .checklist .b{flex:none;width:17px;height:17px;border:1.5px solid var(--ink);border-radius:5px;margin-top:3px}
  .done-screen{text-align:center;padding:14px 0 4px}
  .done-badge{width:70px;height:70px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;
    font-size:32px;margin:0 auto 16px}
  .done-screen h2{font-family:var(--serif);font-weight:500;font-size:1.7rem;margin:0 0 8px}
  .menu-toggle{display:none}
  @media(max-width:840px){
    .shell{grid-template-columns:1fr}
    .sidebar{position:fixed;inset:58px auto 0 0;width:280px;background:var(--bg);transform:translateX(-110%);
      transition:transform .25s;z-index:15;overflow:auto}
    .sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.32)}
    .menu-toggle{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line-2);
      background:var(--paper);color:var(--ink);font-size:17px;cursor:pointer}
    .main{padding-top:34px}
  }
</style>
</head>
<body>
  <div class="topbar">
    <button class="menu-toggle" id="menuToggle" aria-label="Chapters">&#9776;</button>
    <div class="brand"><strong>Get to Value with Harvey</strong><small>Scaled onboarding &middot; sample by Alex Donnelly</small></div>
    <div class="progress-wrap"><div class="progress-track"><div class="progress-bar" id="bar"></div></div><span class="progress-pct" id="pct">0%</span></div>
  </div>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <h2>Chapters</h2>
      <ul class="toc" id="toc"></ul>
    </aside>
    <main class="main"><div id="content"></div>
      <div class="navrow">
        <button class="btn ghost" id="prev">&larr; Back</button>
        <button class="btn primary" id="next">Continue &rarr;</button>
      </div>
      <p class="disc">Independent work sample created for the Harvey Scaled Customer Success Manager application. Not affiliated with or endorsed by Harvey; the customer scenario is fictional and figures are illustrative.</p>
    </main>
  </div>

<script>
const lessons = [
{
  pill:"Welcome", title:"What success looks like &mdash; and how we&rsquo;ll measure it",
  html:`<p>Welcome to Harvey. This short course gets your team from access to a real, repeatable win in your first 30 days &mdash; and sets up the value that makes Harvey worth renewing and expanding.</p>
  <p>We run onboarding around one idea: <strong>value you can see and measure.</strong> Not &ldquo;logins,&rdquo; but hours saved on work you already do, and a result a partner would sign off on.</p>
  <div class="grid">
    <div class="mini"><div class="k">Week 1</div><p>One workflow live, one real win.</p></div>
    <div class="mini"><div class="k">Day 30</div><p>A daily habit for your power users.</p></div>
    <div class="mini"><div class="k">Day 90</div><p>Documented ROI &mdash; and room to grow.</p></div>
  </div>
  <div class="callout"><strong>Why this matters:</strong> adoption is the leading indicator of value. Teams that reach a first win fast keep using Harvey &mdash; and your Customer Success partner is here to make that happen, not just at kickoff but every quarter.</div>`
},
{
  pill:"Chapter 1 &middot; First value", title:"Your first win, this week",
  html:`<p>Don&rsquo;t try to boil the ocean. Pick <strong>one</strong> high-value, low-risk workflow your team does constantly, and run it end to end in Harvey.</p>
  <div class="grid">
    <div class="mini"><div class="k">Good first workflows</div><p>Summarize a long document set. Draft a first-pass research memo. Prep deposition questions from a transcript.</p></div>
    <div class="mini"><div class="k">The &ldquo;first value moment&rdquo;</div><p>The moment a user thinks &ldquo;that just saved me an hour.&rdquo; Get there in the first session.</p></div>
  </div>
  <div class="card"><h3>Try it now</h3><p>Take a non-confidential document you know well. Ask Harvey for a structured summary. Compare it to what you&rsquo;d have written. Note what it nailed and what you&rsquo;d refine &mdash; that instinct is the skill.</p></div>`,
  quiz:{ q:"What&rsquo;s the goal of your team&rsquo;s first session with Harvey?",
    opts:["Configure every available feature","Reach one real &lsquo;that-saved-me-time&rsquo; win on a familiar workflow","Roll Harvey out to the entire firm at once","Replace attorney review entirely"],
    correct:1, ok:"Exactly. A fast first win on one familiar workflow is what builds momentum and durable usage.", no:"Not quite &mdash; the aim is a single, fast win on one familiar workflow, not breadth or replacing review." }
},
{
  pill:"Chapter 2 &middot; Habit", title:"Make it a daily habit",
  html:`<p>A tool used once is a tool forgotten. Retention &mdash; yours and ours &mdash; comes from Harvey becoming the default for a few real tasks.</p>
  <ul>
    <li><strong>Anchor it to existing work.</strong> &ldquo;Every new matter, summarize the record set in Harvey first.&rdquo;</li>
    <li><strong>Let champions lead.</strong> One enthusiastic associate demoing a real win converts skeptics faster than any deck.</li>
    <li><strong>Use the support you have.</strong> Office hours, in-product help, and your CS partner are there between sessions, not just at launch.</li>
  </ul>
  <div class="callout"><strong>Signal we watch together:</strong> weekly active use. If usage dips, that&rsquo;s our cue to step in with a targeted session &mdash; not a renewal surprise later.</div>`
},
{
  pill:"Chapter 3 &middot; Trust", title:"Use it well, and safely",
  html:`<p>In legal work, trust is the product. Three habits keep Harvey&rsquo;s output dependable &mdash; and keep your firm and clients protected.</p>
  <div class="grid">
    <div class="mini"><div class="k">Verify</div><p>Check facts and citations against source before you rely on them. Harvey grounds its answers &mdash; use that.</p></div>
    <div class="mini"><div class="k">Protect</div><p>Know what data goes where. Keep client and privileged material within approved, firm-sanctioned use.</p></div>
    <div class="mini"><div class="k">Human owns it</div><p>An attorney reviews and owns every output. AI is a faster first draft, never the final word.</p></div>
  </div>`,
  quiz:{ q:"A research memo from Harvey looks polished and cites three cases. What do you do before it goes out?",
    opts:["Send it &mdash; it&rsquo;s well written","Verify each citation against source and have an attorney review it","Delete the citations to be safe","Assume it&rsquo;s wrong and rewrite from scratch"],
    correct:1, ok:"Right. Verify against source and keep attorney ownership &mdash; that&rsquo;s what makes AI-assisted work trustworthy.", no:"Not quite &mdash; polish isn&rsquo;t proof. Verify citations against source and keep an attorney in the loop." }
},
{
  pill:"Chapter 4 &middot; Grow", title:"Grow your value over time",
  html:`<p>Once one workflow sticks, expand deliberately. More value per user, and more users, is how Harvey pays for itself many times over.</p>
  <div class="grid">
    <div class="mini"><div class="k">Day 30</div><p>One workflow is a daily habit for your power users.</p></div>
    <div class="mini"><div class="k">Day 60</div><p>A second workflow added; a neighboring team trying it.</p></div>
    <div class="mini"><div class="k">Day 90</div><p>Documented time saved; a value review with your CS partner.</p></div>
  </div>
  <div class="card"><h3>Your quarterly value review</h3><p>Each quarter, your CS partner brings the data &mdash; usage, time saved, where you&rsquo;re getting the most lift &mdash; and we plan the next expansion together. That review is where adoption turns into a renewal you feel good about.</p></div>`,
  quiz:{ q:"What turns steady usage into a confident renewal and expansion?",
    opts:["A bigger discount at renewal time","Documented value plus a quarterly review that plans what&rsquo;s next","Adding every feature whether used or not","Waiting until the contract is nearly up to talk"],
    correct:1, ok:"Yes. Evidence of value, reviewed regularly, makes renewal a formality and expansion an obvious next step.", no:"Not quite &mdash; it&rsquo;s documented value plus a regular forward-looking review, not discounts or last-minute scrambles." }
},
{
  pill:"Finish", title:"Your 30-day plan",
  html:`<p>You&rsquo;re set. Here&rsquo;s the plan to take from here &mdash; and your CS team is in it with you the whole way.</p>
  <ul class="checklist">
    <li><span class="b"></span><span><strong>This week:</strong> pick one workflow and reach a first win.</span></li>
    <li><span class="b"></span><span><strong>Weeks 2&ndash;3:</strong> make it a daily habit; name a champion per team.</span></li>
    <li><span class="b"></span><span><strong>Week 4:</strong> add a second workflow; note time saved.</span></li>
    <li><span class="b"></span><span><strong>Day 90:</strong> value review with your CS partner &mdash; results and what&rsquo;s next.</span></li>
  </ul>
  <div class="callout"><strong>Meet your Customer Success partner.</strong> Between sessions, we monitor your team&rsquo;s health, run office hours, and bring the value story to each review. Reach out any time &mdash; helping you get and stay successful is the whole job.</div>`,
  finish:true
}
];

let i=0; const done=new Set();
const content=document.getElementById('content'), toc=document.getElementById('toc');
const bar=document.getElementById('bar'), pct=document.getElementById('pct');
const prev=document.getElementById('prev'), next=document.getElementById('next');
const sidebar=document.getElementById('sidebar');
document.getElementById('menuToggle').onclick=()=>sidebar.classList.toggle('open');

function buildTOC(){
  toc.innerHTML='';
  lessons.forEach((l,idx)=>{
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.innerHTML=`<span class="num ${done.has(idx)?'done':''}">${done.has(idx)?'&#10003;':idx+1}</span><span class="t">${l.title.replace(/&mdash;.*$/,'').trim()}</span>`;
    if(idx===i) b.classList.add('active');
    b.onclick=()=>{go(idx);sidebar.classList.remove('open');};
    li.appendChild(b); toc.appendChild(li);
  });
}
function updateProgress(){
  const p=Math.round((done.size/lessons.length)*100);
  bar.style.width=p+'%'; pct.textContent=p+'%';
}
function render(){
  const l=lessons[i];
  let html=`<span class="pill">${l.pill}</span><h1 class="lesson">${l.title}</h1>${l.html}`;
  if(l.quiz){
    html+=`<div class="quiz"><p class="qk">Knowledge check</p><p class="q">${l.quiz.q}</p>`;
    l.quiz.opts.forEach((o,oi)=>{ html+=`<button class="opt" data-oi="${oi}">${o}</button>`; });
    html+=`<p class="feedback" id="fb"></p></div>`;
  }
  if(l.finish){
    html+=`<div class="done-screen" id="doneScreen" style="display:none">
      <div class="done-badge">&#10003;</div><h2>Module complete</h2>
      <p>You&rsquo;ve got the plan and the habits. Now go get that first win.</p></div>`;
  }
  content.innerHTML=html;
  window.scrollTo(0,0);

  if(l.quiz){
    const fb=content.querySelector('#fb');
    let answered=false;
    content.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick=()=>{
        if(answered) return; answered=true;
        const oi=+btn.dataset.oi, correct=l.quiz.correct;
        content.querySelectorAll('.opt').forEach(b=>b.disabled=true);
        if(oi===correct){ btn.classList.add('correct'); fb.className='feedback show ok'; fb.innerHTML='&#10003; '+l.quiz.ok; }
        else{ btn.classList.add('wrong'); content.querySelector(`.opt[data-oi="${correct}"]`).classList.add('correct');
          fb.className='feedback show no'; fb.innerHTML=l.quiz.no; }
        markDone();
      };
    });
  } else { markDone(); }

  if(l.finish && done.size>=lessons.length-1){ const ds=content.querySelector('#doneScreen'); if(ds) ds.style.display='block'; }

  prev.disabled = i===0;
  next.textContent = i===lessons.length-1 ? 'Finish' : 'Continue →';
  buildTOC(); updateProgress();
}
function markDone(){ if(!done.has(i)){ done.add(i); buildTOC(); updateProgress(); } }
function go(n){ i=Math.max(0,Math.min(lessons.length-1,n)); render(); }
prev.onclick=()=>go(i-1);
next.onclick=()=>{ markDone(); if(i<lessons.length-1) go(i+1); else { const ds=content.querySelector('#doneScreen'); if(ds){ds.style.display='block';} updateProgress(); } };

render();
</script>
</body>
</html>
